  .info-box { background: white; color: #333; padding: 10px 14px; border-radius: 6px; font-size: 13px; min-width: 190px; }
  .info-box .metric { font-size: 1.6em; font-weight: 700; color: #1b5e20; margin: 4px 0; }

150.43045660100006, -33.48860724299993], [150.4268665610001, -33.49313824199994], [150.436470589, -33.49444125299994], [150.44322658900012, -33.48954724399994], [150.44649859800006, -33.49000924399995], [150.4456135790001, -33.48493624399998], [150.44996058800007, -33.48558025399996], [150.45411056800003, -33.48333124499993], [150.4553425890001, -33.47737324499997], [150.45896458900006, -33.47173823499997], [150.45664158900001, -33.471445254999935], [150.45745159000012, -33.46701224499998], [150.46240157900002, -33.46764724499996], [150.4654365890001, -33.46383124599999], [150.46799158900012, -33.46376523599997], [150.46850860900008, -33.46088624599997], [150.47191058800001, -33.461331245999936], [150.4708996180001, -33.46683623599994], [150.47302256700004, -33.46729124599993], [150.47583459600003, -33.47195624699998], [150.47461056500003, -33.48132223699997], [150.47281458600003, -33.481087255999974], [150.47216656500007, -33.48455424599996], [150.4857737630001, -33.48622827799995], [150.48109898300004, -33.49154857699995], [150.47843405300011, -33.49237064699997], [150.4772810830001, -33.49670067699997], [150.4742001630001, -33.49682170699997], [150.47285502300008, -33.49831948699993]]]]}}]};
const YEAR_SCALES = {"2018": {"lo": 0, "hi": 20, "mean": 0.2}, "2019": {"lo": 0, "hi": 20, "mean": 1.0}, "2020": {"lo": 0, "hi": 20, "mean": 1.0}, "2021": {"lo": 0, "hi": 20, "mean": 2.9}, "2022": {"lo": 0, "hi": 20, "mean": 7.3}, "2023": {"lo": 0, "hi": 20, "mean": 14.1}, "2024": {"lo": 0, "hi": 20, "mean": 10.8}};
const YEARS = [2018, 2019, 2020, 2021, 2022, 2023, 2024];
const K_RADIUS = 24.0094;
const MIN_R = 250;

// Fixed colour scale 0–20%
const scale = chroma.scale(['#ffffff','#c7e9c0','#74c476','#238b45','#00441b']).domain([0, 20]);

function getRadius(d, year) {
  return Math.max(MIN_R, K_RADIUS * Math.sqrt(d['new_' + year] || 0));
}

function getFillColor(val) {
  return val != null ? scale(val).hex() : '#cccccc';
}

function getFillOpacity(val) {
  if (val == null) return 0.35;
  // Fade from 50% opacity at 0% EV → 88% at 20%+
  return 0.5 + Math.min(1, val / 20) * 0.38;
}

const map = L.map('map', { center: [-33.87, 151.10], zoom: 10 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 18,
}).addTo(map);

// Real postcode boundaries — faint outline for reference
L.geoJSON(BOUNDARIES, {
  style: { color: '#bbb', weight: 0.5, fillColor: '#e8e8e8', fillOpacity: 0.15, opacity: 0.5 },
  interactive: false,
}).addTo(map);

// Info box
const info = L.control({ position: 'topright' });
info.onAdd = function() {
  this._div = L.DomUtil.create('div', 'info-box');
  this.update();
  return this._div;
};
info.update = function(d, year) {
  if (!d) { this._div.innerHTML = '<b>Hover over a bubble</b>'; return; }
  const ev = d['ev_' + year];
  const evStr = ev != null ? ev.toFixed(1) + '%' : 'n/a';
  const newTotal = (d['new_' + year] || 0).toLocaleString();
  this._div.innerHTML = `
    <b>${d.suburb}</b> <span style="color:#888;font-size:11px">${d.postcode}</span><br>
    <div class="metric">${evStr}</div>
    <span style="font-size:11px;color:#555">EV share of ${year} new cars</span>
    <div class="row"><span>${year} new registrations</span><span><b>${newTotal}</b></span></div>
    <div class="row"><span>Total fleet</span><span><b>${d.total_vehicles.toLocaleString()}</b></span></div>
    <div class="row"><span>Avg fleet age</span><span><b>${d.avg_age} yrs</b></span></div>
  `;
};
info.addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">EV share of new cars</div>
    <div class="legend-bar"></div>
    <div class="legend-labels"><span>0%</span><span>10%</span><span>20%+</span></div>
    <div class="legend-divider"></div>
    <div style="font-size:11px;font-weight:bold;margin-bottom:4px">Bubble = that year's registrations</div>
    <div class="bubble-scale">
      <svg width="110" height="44">
        <circle cx="10"  cy="40" r="4"  fill="#ccc" stroke="#999" stroke-width="0.5"/>
        <circle cx="38"  cy="40" r="12" fill="#ccc" stroke="#999" stroke-width="0.5"/>
        <circle cx="82"  cy="40" r="22" fill="#ccc" stroke="#999" stroke-width="0.5"/>
        <text x="10"  y="33" text-anchor="middle" font-size="8" fill="#666">100</text>
        <text x="38"  y="25" text-anchor="middle" font-size="8" fill="#666">1k</text>
        <text x="82"  y="15" text-anchor="middle" font-size="8" fill="#666">5k</text>
      </svg>
      <span style="font-size:10px;color:#888">new cars/yr</span>
    </div>
    <div style="margin-top:6px;font-size:10px;color:#999">Grey = &lt;20 new registrations</div>
  `;
  return div;
};
legend.addTo(map);

let currentYear = 2024;

// Build circles keyed by postcode for fast per-year updates
let circleMap = {};

function buildCircles(year) {
  const lg = L.layerGroup();
  // Sort largest-first so smaller circles render on top
  const sorted = [...CIRCLES].sort((a, b) => (b['new_' + year] || 0) - (a['new_' + year] || 0));
  circleMap = {};
  for (const d of sorted) {
    const val = d['ev_' + year];
    const c = L.circle([d.lat, d.lon], {
      radius: getRadius(d, year),
      fillColor: getFillColor(val),
      fillOpacity: getFillOpacity(val),
      color: 'white',
      weight: 0.8,
      opacity: 0.7,
    });
    c.on('mouseover', function() {
      this.setStyle({ weight: 2.5, opacity: 1, color: '#444' });
      this.bringToFront();
      info.update(d, currentYear);
    });
    c.on('mouseout', function() {
      this.setStyle({ weight: 0.8, opacity: 0.7, color: 'white' });
      info.update();
    });
    c.addTo(lg);
    circleMap[d.postcode] = c;
  }
  return lg;
}

let circleLayer = buildCircles(currentYear);
circleLayer.addTo(map);

function goToYear(yr) {
  currentYear = yr;
  slider.value = yr;
  yearLabel.textContent = yr;
  sydneyShare.textContent = 'Sydney-wide avg EV share: ' + YEAR_SCALES[yr].mean + '%';
  info.update();
  // Update each circle's radius + colour for the new year
  for (const d of CIRCLES) {
    const c = circleMap[d.postcode];
    if (!c) continue;
    const val = d['ev_' + yr];
    c.setRadius(getRadius(d, yr));
    c.setStyle({
      fillColor: getFillColor(val),
      fillOpacity: getFillOpacity(val),
      color: 'white', weight: 0.8, opacity: 0.7,
    });
  }
}

const slider      = document.getElementById('slider');
const yearLabel   = document.getElementById('year-label');
const sydneyShare = document.getElementById('sydney-share');
const playBtn     = document.getElementById('play-btn');

slider.addEventListener('input', function() {
  stopPlay();
  goToYear(parseInt(this.value));
});

const FIRST_YEAR = YEARS[0], LAST_YEAR = YEARS[YEARS.length - 1];
const STEP_MS = 1000, PAUSE_MS = 4000;
let playTimer = null;

function isPlaying() { return playTimer !== null; }
function stopPlay() {
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  playBtn.textContent = '▶';
}
function scheduleNext(ms) { playTimer = setTimeout(stepPlay, ms); }
function stepPlay() {
  playTimer = null;
  const next = currentYear < LAST_YEAR ? currentYear + 1 : FIRST_YEAR;
  goToYear(next);
  scheduleNext(next === LAST_YEAR ? PAUSE_MS : STEP_MS);
}
playBtn.addEventListener('click', function() {
  if (isPlaying()) { stopPlay(); }
  else {
    playBtn.textContent = '⏸';
    if (currentYear === LAST_YEAR) goToYear(FIRST_YEAR);
    scheduleNext(STEP_MS);
  }
});
</script>
